# hardware.launch.py 실행 설정. 상대 경로는 이 폴더 기준이다.
# Crazyswarm2 서버 백엔드: cpp(권장, 다수 기체) 또는 cflib
backend: cpp
# Qualisys(motion_capture_tracking) 사용 여부. false면 Lighthouse/Flow deck 등 온보드 추정을 사용한다.
mocap: true
motion_capture_file: motion_capture.yaml
rviz: true
rviz_config: ../visualization.rviz
# true면 launch 후 바로 이륙하지 않고 /fleet/control의 {"op": "start"}를 기다린다.
require_start: true
