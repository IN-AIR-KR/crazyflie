# 실기체용 기체 설정 (Crazyswarm2 crazyflies.yaml 형식, fileversion 3).
# hardware.launch.py가 이 파일을 crazyflie_server와 motion_capture_tracking에 그대로 전달한다.
#
# 반드시 실제 값으로 바꿀 것:
#   - uri: radio://<동글 번호>/<채널>/<전송 속도>/<기체 주소>
#   - initial_position: 실제로 놓은 위치 (Qualisys world 좌표, m). 실제 위치와 0.1m 이상 다르면 안 된다.
#   - 기체 이름(cf1...)은 QTM rigid body 이름과 같아야 pose가 연결된다.
#
# 처음에는 cf1 한 대만 켜서 시험하고, 2대 → 3대 → 5대 순서로 enabled를 늘린다.
# 한 동글당 3~4대를 권장한다. 그 이상이면 동글을 추가해 radio://1/... 처럼 나누고,
# 동글마다 다른 채널을 쓴다.
fileversion: 3

robots:
  cf1:
    enabled: true
    uri: "radio://0/80/2M/E7E7E7E7E1"
    initial_position: [-1.2, 0.0, 0.0]
    type: cf21_active

  cf2:
    enabled: false
    uri: "radio://0/80/2M/E7E7E7E7E2"
    initial_position: [-0.3708, -1.1413, 0.0]
    type: cf21_active

  cf3:
    enabled: false
    uri: "radio://0/80/2M/E7E7E7E7E5"
    initial_position: [0.9708, -0.7053, 0.0]
    type: cf21_active

  cf4:
    enabled: false
    uri: "radio://0/80/2M/E7E7E7E7E7"
    initial_position: [0.9708, 0.7053, 0.0]
    type: cf21_active

  cf5:
    enabled: false
    uri: "radio://0/80/2M/E7E7E7E7E5"
    initial_position: [-0.3708, 1.1413, 0.0]
    type: cf21_active

robot_types:
  # Active Marker Deck + Qualisys: QTM이 rigid body(6DOF)를 직접 계산한다 -> vendor.
  cf21_active:
    motion_capture:
      enabled: true
      tracking: "vendor"
    big_quad: false
    battery:
      voltage_warning: 3.8
      voltage_critical: 3.7

all:
  reference_frame: world
  firmware_params:
    commander:
      enHighLevel: 1
    stabilizer:
      estimator: 2   # Kalman (mocap 사용 시 필수)
      controller: 2  # Mellinger: cmdFullState 추종에 적합
    locSrv:
      extPosStdDev: 1e-3
      extQuatStdDev: 0.5e-1
  firmware_logging:
    enabled: true
    default_topics:
      pose:
        frequency: 50  # Hz. 실행기의 상태 입력. 기체가 많으면 무선 대역폭을 고려한다.
      status:
        frequency: 1   # Hz. 배터리·통신 상태 경고에 필요
  broadcasts:
    num_repeats: 15
    delay_between_repeats_ms: 1
