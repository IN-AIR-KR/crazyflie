# mirror 모드의 시뮬레이션 기체 5대. 이름은 hardware/robots.yaml과 같아야 실기체와 짝지어진다.
# initial_position은 실기체를 놓아야 하는 위치이기도 하다 (mirror.yaml의 offset 적용 전).
# 실기체 uri·유형은 hardware/robots.yaml에서 읽는다. 여기 uri는 시뮬레이션에서 쓰이지 않는다.
fileversion: 3

robots:
  cf1:
    enabled: true
    uri: "radio://0/80/2M/E7E7E7E7E1"
    initial_position: [-1.2, 0.0, 0.0]
    type: cf21_sim

  cf2:
    enabled: true
    uri: "radio://0/80/2M/E7E7E7E7E2"
    initial_position: [-0.3708, -1.1413, 0.0]
    type: cf21_sim

  cf3:
    enabled: true
    uri: "radio://0/80/2M/E7E7E7E7E3"
    initial_position: [0.9708, -0.7053, 0.0]
    type: cf21_sim

  cf4:
    enabled: true
    uri: "radio://0/80/2M/E7E7E7E7E4"
    initial_position: [0.9708, 0.7053, 0.0]
    type: cf21_sim

  cf5:
    enabled: true
    uri: "radio://0/80/2M/E7E7E7E7E5"
    initial_position: [-0.3708, 1.1413, 0.0]
    type: cf21_sim

robot_types:
  cf21_sim:
    motion_capture:
      enabled: false
      tracking: vendor
    big_quad: false
    battery:
      voltage_warning: 3.8
      voltage_critical: 3.7

all:
  reference_frame: world
  firmware_params:
    commander:
      enHighLevel: 1
    stabilizer:
      estimator: 2
      controller: 2
  firmware_logging:
    enabled: true
    default_topics:
      pose:
        frequency: 100
      status:
        frequency: 1
